name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Linux amd64 build -----------------------------------------------------------------------------------------
  build-linux-amd64:
    name: Build (linux-amd64)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel

      - name: Install Go tools
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: |
          make lang resources
          go build -ldflags "-s -w -X main.program=mgmt -X main.version=${{ github.ref_name }}" -o mgmt-static-linux-amd64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mgmt-static-linux-amd64
          path: mgmt-static-linux-amd64
          retention-days: 5

  # ---- Linux arm64 build (native on ubuntu-26.04-arm) ------------------------------------------------------------
  build-linux-arm64:
    name: Build (linux-arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel

      - name: Install Go tools
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Build
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
        run: |
          make lang resources
          go build -ldflags "-s -w -X main.program=mgmt -X main.version=${{ github.ref_name }}" -o mgmt-static-linux-arm64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mgmt-static-linux-arm64
          path: mgmt-static-linux-arm64
          retention-days: 5

  # ---- Darwin arm64 build ----------------------------------------------------------------------------------------
  build-darwin-arm64:
    name: Build (darwin-arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install macOS deps
        run: |
          brew install make gnu-sed ragel libvirt augeas libxml2
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:$PKG_CONFIG_PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> $GITHUB_ENV
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Build
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 1
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig
        run: |
          make lang resources
          go build -ldflags "-s -w -X main.program=mgmt -X main.version=${{ github.ref_name }}" -o mgmt-static-darwin-arm64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mgmt-static-darwin-arm64
          path: mgmt-static-darwin-arm64
          retention-days: 5

  # ---- Tests (runs after all builds succeed) ---------------------------------------------------------------------
  test:
    name: Tests
    needs: [build-linux-amd64, build-linux-arm64, build-darwin-arm64]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel inotify-tools

      - name: Install Go tools + markdown lint + golangci-lint
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.2.2
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev
          sudo gem install mdl -v 0.15.0 --no-document

      - name: Generate language frontend + WASM resources
        run: make lang resources

      - name: Build mgmt
        run: make build

      - name: Run tests (quick smoke)
        run: TEST_BLOCK=basic TEST_GROUP=1 make test

  # ---- Publish to GitHub Releases --------------------------------------------------------------------------------
  publish:
    name: Publish
    needs: [build-linux-amd64, build-linux-arm64, build-darwin-arm64, test]
    runs-on: ubuntu-26.04
    if: needs.test.result == 'success'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mgmt-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum mgmt-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mgmt-static-linux-amd64
            mgmt-static-linux-arm64
            mgmt-static-darwin-arm64
            checksums.txt
          draft: true
