name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Builds (linux-amd64, linux-arm64, darwin-arm64) ------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-26.04
            goos: linux
            goarch: amd64
          - name: linux-arm64
            runner: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
          - name: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          if [ "${{ matrix.runner }}" = "macos-latest" ]; then
            brew install make gnu-sed ragel libvirt augeas libxml2
            echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH
            export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:$PKG_CONFIG_PATH"
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> $GITHUB_ENV
          else
            sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel
          fi

      - name: Install Go tools
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          make lang resources
          go build -ldflags "-s -w -X main.program=mgmt -X main.version=${{ github.ref_name }}" -o mgmt-static-${{ matrix.name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mgmt-static-${{ matrix.name }}
          path: mgmt-static-${{ matrix.name }}
          retention-days: 5

  # ---- Tests (runs after all builds succeed) ---------------------------------------------------------------------
  test:
    name: Tests
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel inotify-tools

      - name: Install Go tools + markdown lint + golangci-lint
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.2.2
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev
          sudo gem install mdl -v 0.15.0 --no-document

      - name: Generate language frontend + WASM resources
        run: make lang resources

      - name: Build mgmt
        run: make build

      - name: Run tests (quick smoke)
        run: TEST_BLOCK=basic TEST_GROUP=1 make test

  # ---- Publish to GitHub Releases --------------------------------------------------------------------------------
  publish:
    name: Publish
    needs: [build, test]
    runs-on: ubuntu-26.04
    if: needs.test.result == 'success'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mgmt-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum mgmt-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mgmt-static-linux-amd64
            mgmt-static-linux-arm64
            mgmt-static-darwin-arm64
            checksums.txt
          draft: true
