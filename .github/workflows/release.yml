name: Release

on:
  push:
    tags:
      - 'v*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Linux builds (amd64 + arm64) ------------------------------------------------------------------------------
  release-linux:
    name: Release Linux (${{ matrix.arch }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
        os: [linux]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel

      - name: Install Go tools (nex, goyacc, stringer, goimports)
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Generate language frontend + WASM resources
        run: make lang resources

      - name: Build mgmt
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          make lang resources
          go build -ldflags "-s -w -X main.program=mgmt -X main.version=${{ github.ref_name }}" -o mgmt-static-${{ matrix.os }}-${{ matrix.arch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mgmt-static-${{ matrix.os }}-${{ matrix.arch }}
          path: mgmt-${{ matrix.arch }}
          retention-days: 5

  # ---- macOS build (arm64) ------------------------------------------------------------------------------------------------
  # TEMPORARILY DISABLED -- GNU make issue (same as test.yaml)
  # release-darwin:
  #   name: Release Darwin (arm64)
  #   runs-on: macos-latest
  #   ...

  # ---- Publish to GitHub Releases ----------------------------------------------------------------------------------
  publish:
    name: Publish
    needs: [release-linux]
    runs-on: ubuntu-26.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mgmt-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum mgmt-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mgmt-static-linux-amd64
            checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
