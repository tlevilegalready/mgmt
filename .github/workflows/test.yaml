name: Test

on:
  pull_request:
  push:
  schedule:
    - cron: '0 4 * * 1'  # weekly Monday 04:00 UTC (regression safety net)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Build (Linux) ---------------------------------------------------
  build:
    name: Build (linux-amd64)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel inotify-tools

      - name: Install Go tools (nex, goyacc, stringer, goimports)
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Generate language frontend + WASM resources
        run: make lang resources

      - name: Build
        run: make build

  # ---- Go tests (Linux) -- parallel groups for go-test + shell ------------------------------------
  # Basic block split into 2 parallel groups to reduce 254s -> ~70s
  # Group 1: lang, engine/resources, engine/graph, etcd
  # Group 2: known slow packages (lang, engine/resources, engine/graph, etcd) (cli, converger, util, etc.)
  go-tests-basic-1:
    name: Go tests (basic group 1 - fast)
    needs: [build, build-macos]
    runs-on: ubuntu-26.04
    env:
      TEST_BLOCK: basic
      TEST_GROUP: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel inotify-tools

      - name: Install Go tools (nex, goyacc, stringer, goimports)
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Generate language frontend + WASM resources
        run: make lang resources

      - name: Install linting tools
        run: |
          # golangci-lint (build from source to match Go 1.26)
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.2.2
          # Ruby + mdl for markdown lint
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev
          sudo gem install mdl -v 0.15.0 --no-document

      - name: Build test tools (reflowed-comments, receiver-check, txtarfmt)
        run: make -C test

      - name: Build
        run: make build

      - name: Run tests
        run: TEST_BLOCK="$TEST_BLOCK" TEST_GROUP="$TEST_GROUP" make test

  go-tests-basic-2:
    name: Go tests (basic group 2 + shell - slow)
    needs: [build, build-macos]
    runs-on: ubuntu-26.04
    env:
      TEST_BLOCK: basic
      TEST_GROUP: 2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel inotify-tools

      - name: Install Go tools (nex, goyacc, stringer, goimports)
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Generate language frontend + WASM resources
        run: make lang resources

      - name: Install linting tools
        run: |
          # golangci-lint (build from source to match Go 1.26)
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.2.2
          # Ruby + mdl for markdown lint
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev
          sudo gem install mdl -v 0.15.0 --no-document

      - name: Build test tools (reflowed-comments, receiver-check, txtarfmt)
        run: make -C test

      - name: Build
        run: make build

      - name: Run basic tests
        run: TEST_BLOCK=basic TEST_GROUP=2 make test

      - name: Run shell tests
        run: TEST_BLOCK=shell make test

  # ---- Go tests (race detector) -- runs last, only on Go code changes --------------------
  # The race detector adds 5-10x overhead. Only run when Go code changed,
  # and run last so it doesn't block other tests.
  go-tests-race:
    name: Go tests (race)
    needs: [build, go-tests-basic-1, go-tests-basic-2]
    runs-on: ubuntu-26.04
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.event.head_commit.files) ||
      (github.event_name == 'pull_request' && github.event.pull_request.files)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Check for Go code changes
        id: check-go
        shell: bash
        run: |
          changed_files=""
          if [ "${{ github.event_name }}" = "push" ]; then
            changed_files=$(echo '${{ toJSON(github.event.head_commit.files) }}')
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files=$(echo '${{ toJSON(github.event.pull_request.files) }}')
          fi

          if echo "$changed_files" | grep -q '\.go$'; then
            echo "has_go=1" >> "$GITHUB_OUTPUT"
            echo "Go code detected in changes, running race detector"
          else
            echo "has_go=0" >> "$GITHUB_OUTPUT"
            echo "No Go code changes detected, skipping race detector"
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
        if: steps.check-go.outputs.has_go == '1'

      - name: Install CGO dependencies
        if: steps.check-go.outputs.has_go == '1'
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel inotify-tools

      - name: Install Go tools (nex, goyacc, stringer, goimports)
        if: steps.check-go.outputs.has_go == '1'
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Generate language frontend + WASM resources
        if: steps.check-go.outputs.has_go == '1'
        run: make lang resources

      - name: Build
        if: steps.check-go.outputs.has_go == '1'
        run: make build

      - name: Run tests (race)
        if: steps.check-go.outputs.has_go == '1'
        run: TEST_BLOCK=race make test

      - name: Skip race detector
        if: steps.check-go.outputs.has_go != '1'
        run: echo "Skipping race detector -- no Go code changes"

  # ---- macOS build + test (GNU sed via brew) ---------------------------------------------------
  build-macos:
    name: Build (darwin-arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GNU make, GNU sed + Go tools
        run: |
          brew install make gnu-sed ragel libvirt augeas libxml2 pkg-config
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Generate language frontend + WASM resources
        run: make lang resources

      - name: Build
        run: make build
