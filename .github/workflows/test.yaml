name: Test

on:
  pull_request:
  push:
  schedule:
    - cron: '0 4 * * 1'  # weekly Monday 04:00 UTC (regression safety net)

jobs:
  # ── Build ──────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GNU make (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install make

      - name: Install CGO dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc

      - name: Install Go tools (nex, goyacc, stringer)
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Generate language frontend + WASM resources
        run: make lang resources

      - name: Build
        run: make build

  # ── Go tests (Linux) ───────────────────────────────────────────────────
  go-tests:
    name: Go tests (${{ matrix.block }})
    needs: build
    runs-on: ubuntu-latest
    env:
      TEST_BLOCK: ${{ matrix.block }}
    strategy:
      fail-fast: false
      matrix:
        block: [basic, race, shell]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel

      - name: Install Go tools (nex, goyacc, stringer, goimports)
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      # ── Tools needed only by the "basic" block ────────────────────────
      - name: Install linting tools (basic only)
        if: matrix.block == 'basic'
        run: |
          # golangci-lint
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.2.2
          # Ruby + mdl for markdown lint
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev
          sudo gem install mdl -v 0.15.0 --no-document

      - name: Build test tools (reflowed-comments, receiver-check, txtarfmt)
        if: matrix.block == 'basic'
        run: make -C test

      - name: Generate language frontend + WASM resources
        run: make lang resources

      - name: Build
        run: make build

      - name: Run tests
        run: TEST_BLOCK="$TEST_BLOCK" make test

  # ── Go tests (macOS) ───────────────────────────────────────────────────
  go-tests-macos:
    name: Go tests (macOS ${{ matrix.block }})
    needs: build
    runs-on: macos-latest
    env:
      TEST_BLOCK: ${{ matrix.block }}
    strategy:
      fail-fast: false
      matrix:
        block: [basic, shell]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GNU make
        run: brew install make

      - name: Install CGO dependencies
        run: brew install libvirt augeas pkg-config

      - name: Install Go tools (nex, goyacc, stringer, goimports)
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Install linting tools (basic only)
        if: matrix.block == 'basic'
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.2.2
          brew install ruby
          sudo gem install mdl -v 0.15.0 --no-document

      - name: Build test tools (basic only)
        if: matrix.block == 'basic'
        run: make -C test

      - name: Generate language frontend + WASM resources
        run: make lang resources

      - name: Build
        run: make build

      - name: Run tests
        run: TEST_BLOCK="$TEST_BLOCK" make test
