name: Test

on:
  pull_request:
  push:
  schedule:
    - cron: '0 4 * * 1'  # weekly Monday 04:00 UTC (regression safety net)

jobs:
  # ── Build (Linux only — macOS disabled temporarily, see below) ─────────
  build:
    name: Build (linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel

      - name: Install Go tools (nex, goyacc, stringer, goimports)
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Generate language frontend + WASM resources
        run: make lang resources

      - name: Build
        run: make build

  # ── Go tests (Linux) ───────────────────────────────────────────────────
  go-tests:
    name: Go tests (${{ matrix.block }})
    needs: build
    runs-on: ubuntu-latest
    env:
      TEST_BLOCK: ${{ matrix.block }}
    strategy:
      fail-fast: false
      matrix:
        block: [basic, race, shell]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev libaugeas-dev pkg-config gcc ragel

      - name: Install Go tools (nex, goyacc, stringer, goimports)
        run: |
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@latest
          go install golang.org/x/tools/cmd/stringer@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Generate language frontend + WASM resources
        run: make lang resources

      # ── Tools needed only by the "basic" block ────────────────────────
      - name: Install linting tools (basic only)
        if: matrix.block == 'basic'
        run: |
          # golangci-lint
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.2.2
          # Ruby + mdl for markdown lint
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev
          sudo gem install mdl -v 0.15.0 --no-document

      - name: Build test tools (reflowed-comments, receiver-check, txtarfmt)
        if: matrix.block == 'basic'
        run: make -C test

      - name: Build
        run: make build

      - name: Run tests
        run: TEST_BLOCK="$TEST_BLOCK" make test

# ── macOS temporarily disabled ────────────────────────────────────────────
# The upstream Makefile uses GNU make extensions that fail on macOS's BSD make.
# Fix requires either:
#   1. Add GNU make to PATH on macOS runners (gmake via brew, gnubin on PATH)
#   2. Patch upstream Makefile to use POSIX-compatible make syntax
# TODO: re-enable with `brew install make && echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH`
